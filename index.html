<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- iPhone/Home Screen friendliness -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ready Set Quit" />

  <title>Ready Set Quit</title>

  <style>
    :root{
      --bg:#0b0c10;
      --text:#e8e8e8;
      --card:#12141a;
      --panel:#0f1117;
      --border:#262a35;
      --btnBg:#e8e8e8;
      --btnText:#0b0c10;
      --muted: rgba(232,232,232,.75);
      --shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    [data-theme="light"]{
      --bg:#f6f6f8;
      --text:#12121a;
      --card:#ffffff;
      --panel:#f1f1f5;
      --border:#d8d8e2;
      --btnBg:#12121a;
      --btnText:#ffffff;
      --muted: rgba(18,18,26,.70);
      --shadow: 0 10px 28px rgba(10,10,15,.10);
    }

    body{
      font-family: -apple-system, system-ui, Arial, sans-serif;
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .card{
      max-width: 560px;
      margin: 0 auto;
      background:var(--card);
      border:1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    h1{ margin: 0 0 6px; font-size: 22px; }
    .sub{ opacity:.9; margin: 0 0 14px; font-size: 14px; color: var(--muted); }
    .row{ display:flex; gap:10px; flex-wrap: wrap; align-items: center; }
    .box{
      flex: 1;
      min-width: 160px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .label{ font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .big{ font-size: 32px; font-weight: 700; letter-spacing: .5px; }
    .msg{
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background:var(--panel);
      border:1px solid var(--border);
    }
    button{
      padding: 12px 14px;
      border-radius: 12px;
      border:1px solid var(--border);
      background:var(--btnBg);
      color:var(--btnText);
      font-weight:700;
      -webkit-tap-highlight-color: transparent;
    }
    button.secondary{
      background: transparent;
      color:var(--text);
    }
    input, select{
      padding: 10px;
      border-radius: 10px;
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
    }
    .muted{ color: var(--muted); font-size: 12px; margin-top: 10px; }
    .pill{
      display:inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--border);
      font-size: 12px;
      opacity:.95;
    }
    .hr{ height:1px; background:var(--border); margin:14px 0; }
    .themeBtn{
      padding: 10px 12px;
      font-size: 12px;
      border-radius: 999px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="topbar">
      <div>
        <h1>Ready Set Quit</h1>
        <p class="sub">V1: a timer that “pushes the next one out” with a small random lag so it’s not exact.</p>
      </div>
      <button id="themeBtn" class="secondary themeBtn" type="button">Theme</button>
    </div>

    <div class="row">
      <div class="box">
        <div class="label">Next window opens in</div>
        <div class="big" id="countdown">--:--</div>
        <div class="muted" id="windowNote">—</div>
      </div>
      <div class="box">
        <div class="label">Today</div>
        <div><span class="pill">Smoked: <b id="smokedToday">0</b></span></div>
        <div style="margin-top:8px;"><span class="pill">Avoided: <b id="avoidedToday">0</b></span></div>
        <div style="margin-top:8px;"><span class="pill">Saved (est.): <b id="savedToday">$0.00</b></span></div>
      </div>
    </div>

    <div class="msg" id="messageBox">Loading…</div>

    <div class="hr"></div>

    <div class="row">
      <button id="startBtn" type="button">Start</button>
      <button class="secondary" id="iSmokedBtn" type="button">I smoked</button>
      <button class="secondary" id="iWaitedBtn" type="button">I waited</button>
      <button class="secondary" id="resetBtn" type="button">Reset day</button>
    </div>

    <div class="hr"></div>

    <div class="row">
      <label class="muted">Base interval</label>
      <select id="baseInterval">
        <option value="60">60 min</option>
        <option value="75">75 min</option>
        <option value="90">90 min</option>
        <option value="120">120 min</option>
      </select>

      <label class="muted">Random lag</label>
      <select id="lagWindow">
        <option value="3">± 3 min</option>
        <option value="5" selected>± 5 min</option>
        <option value="10">± 10 min</option>
        <option value="15">± 15 min</option>
      </select>

      <label class="muted">Pack price ($)</label>
      <input id="packPrice" type="number" step="0.01" min="0" value="10" style="width:110px;" />

      <label class="muted">Cigs/pack</label>
      <input id="cigsPerPack" type="number" step="1" min="1" value="20" style="width:90px;" />
    </div>

    <p class="muted">
      Notes: V1 is local-only (no accounts). If you want notifications later, we add them after the core loop works.
    </p>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const STATE_KEY = "rsq_state_v1_static";
  const THEME_KEY = "rsq_theme_v1";

  // Local date key (prevents UTC day drift on iPhone)
  const dayKey = () => {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const da = String(d.getDate()).padStart(2,"0");
    return `rsq_day_${y}-${m}-${da}`;
  };

  const messages = {
    health: [
      "Your lungs don’t care about excuses — they care about time.",
      "Every delay is less smoke in your bloodstream. Keep pushing it out.",
      "Craving peaks and drops. Your job is to outlast the peak."
    ],
    social: [
      "Not smelling like smoke is a flex. Quiet win.",
      "Less smoke = fewer people silently judging you. That matters.",
      "You’re buying back respect in public one delay at a time."
    ],
    money: [
      "You’re literally burning money. Delaying is stopping the leak.",
      "That timer is a wallet shield. Let it do its job.",
      "Small delays stack into real cash. Don’t underestimate compounding."
    ],
    discipline: [
      "You don’t need motivation — you need reps. This is a rep.",
      "Win the next 5 minutes. Then do it again.",
      "You’re training trajectory: aim long, release slow."
    ],
    blunt: [
      "The craving is loud. You don’t have to be.",
      "If you smoke now, you pay twice: money + damage.",
      "This is the part where you prove you’re not owned by it."
    ]
  };

  function pickMessage(){
    const cats = Object.keys(messages);
    const cat = cats[Math.floor(Math.random() * cats.length)];
    const arr = messages[cat];
    return { cat, msg: arr[Math.floor(Math.random() * arr.length)] };
  }

  function loadState(){
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch {
      return null;
    }
  }

  function saveState(s){
    localStorage.setItem(STATE_KEY, JSON.stringify(s));
  }

  function defaultState(){
    return {
      running:false,
      nextAt:null,
      baseMinutes:60,
      lagMinutes:5,
      packPrice:10,
      cigsPerPack:20,
      smoked:{},
      avoided:{},
      saved:{},
      lastMsg:null
    };
  }

  function getCounts(s){
    const k = dayKey();
    return {
      smoked: s.smoked?.[k] || 0,
      avoided: s.avoided?.[k] || 0,
      saved: s.saved?.[k] || 0
    };
  }

  function setCounts(s, smoked, avoided, saved){
    const k = dayKey();
    s.smoked = s.smoked || {};
    s.avoided = s.avoided || {};
    s.saved = s.saved || {};
    s.smoked[k] = smoked;
    s.avoided[k] = avoided;
    s.saved[k] = saved;
  }

  function moneyPerCig(s){
    const packPrice = Number(s.packPrice);
    const cigsPerPack = Number(s.cigsPerPack);
    if (!isFinite(packPrice) || !isFinite(cigsPerPack) || cigsPerPack <= 0) return 0;
    return packPrice / cigsPerPack;
  }

  function fmt(ms){
    const total = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(total / 60);
    const sec = total % 60;
    return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
  }

  function render(s){
    const { smoked, avoided, saved } = getCounts(s);
    $("smokedToday").textContent = smoked;
    $("avoidedToday").textContent = avoided;
    $("savedToday").textContent = "$" + Number(saved || 0).toFixed(2);

    // hydrate controls from state (so settings persist)
    $("baseInterval").value = String(s.baseMinutes || 60);
    $("lagWindow").value = String(s.lagMinutes || 5);
    $("packPrice").value = String(s.packPrice ?? 10);
    $("cigsPerPack").value = String(s.cigsPerPack ?? 20);

    if (!s.running || !s.nextAt){
      $("countdown").textContent = "--:--";
      $("windowNote").textContent = "Press Start to begin.";
      $("messageBox").textContent = "V1 rule: you’re not aiming for perfect — you’re aiming for “later than last time.”";
      return;
    }

    const remaining = s.nextAt - Date.now();
    if (remaining <= 0){
      $("countdown").textContent = "00:00";
      $("windowNote").textContent = "Window is open. If you can wait anyway, hit “I waited.”";
    } else {
      $("countdown").textContent = fmt(remaining);
      $("windowNote").textContent = "Not exact on purpose (random lag is active).";
    }

    if (s.lastMsg?.msg) $("messageBox").textContent = s.lastMsg.msg;
  }

  function scheduleNext(s){
    const base = Number($("baseInterval").value) || 60;
    const lag = Number($("lagWindow").value) || 5;

    // persist settings into state
    s.baseMinutes = base;
    s.lagMinutes = lag;
    s.packPrice = Number($("packPrice").value || 10);
    s.cigsPerPack = Number($("cigsPerPack").value || 20);

    const jitter = (Math.random() * 2 - 1) * lag; // -lag..+lag
    const minutes = Math.max(5, base + jitter);
    s.nextAt = Date.now() + Math.round(minutes * 60 * 1000);
    s.running = true;
    s.lastMsg = pickMessage();

    saveState(s);
    render(s);
  }

  // Theme (Option C)
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    $("themeBtn").textContent = "Theme: " + (t === "light" ? "Light" : "Dark");
    localStorage.setItem(THEME_KEY, t);
  }
  const storedTheme = localStorage.getItem(THEME_KEY);
  applyTheme(storedTheme === "light" ? "light" : "dark");
  $("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || "dark";
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // Init
  let s = loadState() || defaultState();

  $("startBtn").addEventListener("click", () => scheduleNext(s));

  $("iSmokedBtn").addEventListener("click", () => {
    const c = getCounts(s);
    setCounts(s, c.smoked + 1, c.avoided, c.saved);
    saveState(s);
    scheduleNext(s);
  });

  $("iWaitedBtn").addEventListener("click", () => {
    const c = getCounts(s);
    const newAvoided = c.avoided + 1;
    const newSaved = Number(c.saved) + moneyPerCig(s);
    setCounts(s, c.smoked, newAvoided, newSaved);

    s.lastMsg = { cat:"discipline", msg:`You waited. That’s a win. Avoided today: ${newAvoided}.` };
    saveState(s);
    scheduleNext(s);
  });

  $("resetBtn").addEventListener("click", () => {
    if (!confirm("Reset today’s counts and stop the timer?")) return;
    setCounts(s, 0, 0, 0);
    s.running = false;
    s.nextAt = null;
    s.lastMsg = { cat:"blunt", msg:"Day reset. New rule: later than last time." };
    saveState(s);
    render(s);
  });

  // Save settings changes immediately
  ["baseInterval","lagWindow","packPrice","cigsPerPack"].forEach(id => {
    $(id).addEventListener("change", () => {
      s.baseMinutes = Number($("baseInterval").value || 60);
      s.lagMinutes = Number($("lagWindow").value || 5);
      s.packPrice = Number($("packPrice").value || 10);
      s.cigsPerPack = Number($("cigsPerPack").value || 20);
      saveState(s);
      render(s);
    });
  });

  // Tick
  render(s);
  setInterval(() => render(s), 250);
})();
</script>
</body>
</html>
